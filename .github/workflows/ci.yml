name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: |
          mkdir -p coverage
          go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage/coverage.out ./...

      - name: Test password package with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 -race ./internal/password

      - name: Create coverage reports
        shell: bash
        run: |
          go tool cover -func=coverage/coverage.out | tee coverage/coverage.txt
          go tool cover -html=coverage/coverage.out -o coverage/coverage.html
          printf '## Coverage\n\n```text\n%s\n```\n' \
            "$(tail -n1 coverage/coverage.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/coverage.out
            coverage/coverage.txt
            coverage/coverage.html
          if-no-files-found: error
          retention-days: 14
          overwrite: true
