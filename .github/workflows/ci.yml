name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        id: coverage_test
        run: npm run coverage

      - name: Create coverage summary
        id: coverage_reports
        env:
          COVERAGE_LANGUAGE: typescript
        run: node .github/scripts/coverage-comment.cjs

      - name: Upload coverage reports
        id: coverage_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Update coverage comment
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_LANGUAGE: typescript
          COVERAGE_TEST_OUTCOME: ${{ steps.coverage_test.outcome }}
          COVERAGE_REPORT_OUTCOME: ${{ steps.coverage_reports.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        with:
          script: |
            const updateCoverageComment = require('./.github/scripts/coverage-comment.cjs');
            await updateCoverageComment({ github, context, core });

  go-lint:
    name: Go Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Check go.mod tidiness
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

  go-test:
    name: Go Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Test
        run: go test -count=1 ./...

  go-coverage:
    name: Go Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Test with coverage
        id: coverage_test
        run: |
          mkdir -p coverage
          go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage/coverage.out ./...

      - name: Create coverage reports
        id: coverage_reports
        shell: bash
        run: |
          go tool cover -func=coverage/coverage.out | tee coverage/coverage.txt
          go tool cover -html=coverage/coverage.out -o coverage/coverage.html
          printf '%s\n' '## Go Coverage' '' '```text' \
            "$(tail -n1 coverage/coverage.txt)" '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        id: coverage_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-report
          path: |
            coverage/coverage.out
            coverage/coverage.txt
            coverage/coverage.html
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Update coverage comment
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_LANGUAGE: go
          COVERAGE_TEST_OUTCOME: ${{ steps.coverage_test.outcome }}
          COVERAGE_REPORT_OUTCOME: ${{ steps.coverage_reports.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
        with:
          script: |
            const updateCoverageComment = require('./.github/scripts/coverage-comment.cjs');
            await updateCoverageComment({ github, context, core });

  go-race:
    name: Go Race
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Test with race detector
        run: go test -count=1 -race ./...
