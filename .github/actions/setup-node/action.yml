name: Setup Node
description: Install Node from .nvmrc and restore the npm package cache

runs:
  using: composite
  steps:
    - name: Install Node and restore npm cache
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
